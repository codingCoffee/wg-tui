name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -o wgt-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/wgt

      - uses: actions/upload-artifact@v4
        with:
          name: wgt-${{ matrix.goos }}-${{ matrix.goarch }}
          path: wgt-${{ matrix.goos }}-${{ matrix.goarch }}

  nix:
    name: Validate Nix flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: DeterminateSystems/nix-installer-action@v3

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(sed -nE 's/^[[:space:]]*version = "([^"]+)";/\1/p' flake.nix | head -n 1)"
          test "$actual" = "$expected" || {
            echo "flake.nix version ($actual) does not match release tag ($GITHUB_REF_NAME)"
            exit 1
          }

      - name: Check flake
        run: nix flake check --no-build

      - name: Build package
        run: nix build .#default --no-link

  release:
    needs: [build, nix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: wgt-*
